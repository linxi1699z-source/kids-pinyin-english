:root{--ink:#293b42;--muted:#718086;--paper:#fffaf1;--card:#fff;--green:#dcefe4;--green-dark:#2f715d;--peach:#ffe7d7;--line:#eee7db;--shadow:0 8px 24px #53412a0c}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.app{max-width:720px;min-height:100svh;margin:auto;padding:env(safe-area-inset-top) 18px calc(102px + env(safe-area-inset-bottom));}.top{display:flex;align-items:center;justify-content:space-between;padding:18px 0 12px}.brand{font-weight:800;font-size:17px;letter-spacing:.02em}.switch{border:0;border-radius:999px;background:var(--green);color:var(--green-dark);font-weight:700;padding:10px 14px;font-size:14px}.switch span{opacity:.55;margin:0 5px}.hero{padding:17px 4px 14px}.eyebrow{font-size:12px;color:var(--green-dark);font-weight:800;letter-spacing:.12em}.hero h1{font-size:27px;line-height:1.25;margin:8px 0 6px}.hero p{font-size:14px;line-height:1.6;color:var(--muted);margin:0}.progress{margin-top:16px;display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px}.track{height:6px;flex:1;background:#eee9df;border-radius:8px;overflow:hidden}.track i{display:block;height:100%;background:#87b69c;border-radius:8px;width:0;transition:width .3s}.section{margin-top:22px}.section-head{display:flex;align-items:baseline;gap:9px;margin:0 2px 11px}.section-head h2{font-size:17px;margin:0}.section-head small{font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}.tile{aspect-ratio:1;border:1px solid var(--line);border-radius:16px;background:var(--card);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:750;color:var(--ink);cursor:pointer;transition:transform .15s,border-color .15s}.tile:active{transform:scale(.94)}.tile.done{background:#f0f7f1;color:var(--green-dark);border-color:#cde3d5}.tile.current{border:2px solid #75a88c;backgrou <main class="app" id="home">
 <header class="top"><div class="brand">🌱 拼音与英语启蒙</div><button class="switch" id="switch">拼音 <span>↔</span> 英语</button></header>
 <section class="hero"><div class="eyebrow" id="eyebrow">每天一点点，轻松开口</div><h1 id="title">拼音小乐园</h1><p id="subtitle">先认识声母和韵母，再听一听、读一读。</p><img class="hero-art" src="assets/mascot.png" alt="拿着蜡笔的小恐龙"><div class="progress"><span id="learned">已认识 0 个</span><div class="track"><i id="progress"></i></div><span id="total">共 47 个</span></div></section>

</main>
<div class="fixed" id="fixed"><button class="start" id="start">开始学习　→</button></div>
<section class="detail hidden" id="detail"><div class="detail-top"><button class="back" id="back" aria-label="返回">‹</button><span class="detail-count" id="detailCount"></span><span style="width:42px"></span></div><article class="card" id="card"><div class="scene" id="scene" aria-hidden="true"></div><div class="char" id="char"></div><div class="sound-guide" id="soundGuide"></div><div class="detail-kind" id="kind"></div><p class="example" id="example"></p><p class="translation" id="translation"></p><div class="tip" id="tip">看一看，跟着念一念</div></article><div class="controls"><button class="control" id="prev">← 上一个</button><button class="control play" id="play"><span class="speaker">🔊</span>听一听</button><button class="control" id="next">下一个 →</button></div><audio id="player" preload="none" playsinline></audio><div class="detail-bottom">慢慢听、慢慢跟读：字母或拼音 3 遍，例子 2 遍</div></section>
<script>
const initials=[['声母','音节开头的小帮手','b p m f d t n l g k h j q x zh ch sh r z c s y w']];
const finals=[['韵母','一个韵母也能唱','a o e i u ü'],['复韵母','两个元音滑着读','ai ei ui ao ou iu ie üe'],['特殊韵母','鼻音韵母','er an en in un ün ang eng ing ong']];
const pinyinItems={};
function addPinyinGroup(name,desc,raw){let items=raw.split(' ').map(s=>({char:s,kind:name,example:pinyinExample[s]||'小朋友，跟我读一读。',translation:'',tip:desc,lang:'zh'}));pinyinItems[name]=items;return items}
const pinyinExample={b:'班班背上小书包。',p:'拍拍皮球，和伙伴一起玩。',m:'明明和苗苗一起搭积木。',f:'放学了，我们挥挥手。',d:'豆豆带来恐龙图书。',t:'同学们听老师讲故事。',n:'妮妮拿来新的蜡笔。',l:'乐乐来幼儿园，老师说早。',g:'哥哥给我一辆工程车。',k:'课堂上，我们看看恐龙。',h:'和好朋友手拉手去操场。',j:'姐姐教我画挖掘机。',q:'七只小恐龙排队上课。',x:'下课了，我们一起洗手。',zh:'桌上有只蜘蛛玩具。',ch:'晨晨穿着超人披风来上学。',sh:'老师说：“小手轻轻放好。”',r:'然然认识了新朋友。',z:'走到操场，大家做早操。',c:'操场上，彩色皮球滚过来。',s:'三位小朋友分享积木。',y:'幼儿园里有有趣的游戏。',w:'我们围着挖掘机玩具看。',a:'安安和同学一起搭积木。',o:'哦，恐龙的脚印好大呀！',e:'额头贴着小星星，真勇敢。',i:'一起来给小恐龙涂颜色。',u:'午睡醒来，我们收好被子。','ü':'雨天，我们穿雨衣去幼儿园。',ai:'排好队，老师带我们去操场。',ei:'每天和同学说一声早。',ui:'小队伍排整齐，准备做游戏。',ao:'奥特曼玩偶陪我上学。',ou:'老师讲故事，我们认真听。',iu:'六只恐龙排队过小桥。',ie:'下课后，我们一起去找老师。','üe':'月亮出来了，幼儿园放学啦。',er:'耳朵听听，朋友在叫我。',an:'安安把恐龙画给老师看。',en:'我们认真听老师讲故事。',in:'今天我和新同学一起玩。',un:'小朋友们轮流玩挖掘机。','ün':'云云和军军一起拼恐龙。',ang:'操场上，大家快乐地奔跑。',eng:'小灯亮了，我们准备回家。',ing:'听老师的话，轮流玩玩具。',ong:'同学们一起给恐龙涂颜色。'};
// 普通话提示音用汉字提供给系统中文语音，避免把拼音字母当英文名称拼读。
const pinyinVoice={b:'玻',p:'坡',m:'摸',f:'佛',d:'得',t:'特',n:'讷',l:'勒',g:'哥',k:'科',h:'喝',j:'鸡',q:'七',x:'西',zh:'知',ch:'吃',sh:'诗',r:'日',z:'资',c:'刺',s:'丝',y:'衣',w:'乌',a:'啊',o:'噢',e:'婀',i:'衣',u:'乌','ü':'迂',ai:'哀',ei:'诶',ui:'威',ao:'凹',ou:'欧',iu:'优',ie:'耶','üe':'约',er:'儿',an:'安',en:'恩',in:'因',un:'温','ün':'晕',ang:'肮',eng:'鞥',ing:'英',ong:'翁'};
const initialGuide={b:'bō',p:'pō',m:'mō',f:'fō',d:'dē',t:'tē',n:'nē',l:'lē',g:'gē',k:'kē',h:'hē',j:'jī',q:'qī',x:'xī',zh:'zhī',ch:'chī',sh:'shī',r:'rī',z:'zī',c:'cī',s:'sī',y:'yī',w:'wū'};
const data={zh:[],en:[]};
initials.forEach(g=>data.zh.push(...addPinyinGroup(...g)));finals.forEach(g=>data.zh.push(...addPinyinGroup(...g)));const flat=addPinyinGroup('平舌音','舌尖轻轻平伸','z c s');const retro=addPinyinGroup('翘舌音','舌尖轻轻翘起来','zh ch sh r');
const alphabet='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');const lower='abcdefghijklmnopqrstuvwxyz'.split('');const words={A:['Apple','苹果'],B:['Book','书'],C:['Class','班级'],D:['Dinosaur','恐龙'],E:['Elephant','大象'],F:['Friend','朋友'],G:['Game','游戏'],H:['Hello','你好'],I:['In','在里面'],J:['Jump','跳'],K:['Kite','风筝'],L:['Lunch','午餐'],M:['Moon','月亮'],N:['Nose','鼻子'],O:['Octopus','章鱼'],P:['Paw Patrol','汪汪队'],Q:['Quiet','安静'],R:['Robot','机器人'],S:['School','学校'],T:['Toy','玩具'],U:['Up','向上'],V:['Van','汽车'],W:['Water','水'],X:['Box','盒子'],Y:['Yo-yo','悠悠球'],Z:['Zoo','动物园']};
const letterSound={A:'æ',B:'b',C:'k',D:'d',E:'ɛ',F:'f',G:'g',H:'h',I:'ɪ',J:'dʒ',K:'k',L:'l',M:'m',N:'n',O:'ɑ',P:'p',Q:'kw',R:'r',S:'s',T:'t',U:'ʌ',V:'v',W:'w',X:'ks',Y:'j',Z:'z'};
data.en=[...alphabet,...lower].map(ch=>{let up=ch.toUpperCase(),w=words[up];let example=up==='X'?'A box.':`${w[0]}.`;let trans=up==='X'?'一个盒子。':`${w[0]}：${w[1]}。`;return{char:ch,kind:ch===up?'大写字母 · 字母音':'小写字母 · 字母音',example,translation:trans,tip:`${ch} says ${letterSound[up]}.`,lang:'en'}});
let mode='zh',idx=0,isSpeaking=false,speechToken=0,detailTimer=null,visited={zh:new Set(),en:new Set()};const $=id=>document.getElementById(id);
function groups(){return mode==='zh'?[...initials.map(g=>[g[0],pinyinItems[g[0]]]),...finals.map(g=>[g[0],pinyinItems[g[0]]]),['平舌音',flat],['翘舌音',retro]]:[['大写字母',data.en.slice(0,26)],['小写字母',data.en.slice(26)]]}
function render(){let isEn=mode==='en',items=data[mode],seen=visited[mode].size;$('title').textContent=isEn?'英语字母乐园':'拼音小乐园';$('subtitle').textContent=isEn?'认识 26 个字母，听听它们的名字和声音。':'先认识声母和韵母，再听一听、读一读。';$('eyebrow').textContent=isEn?'每天一点点，快乐学英语':'每天一点点，轻松开口';$('switch').innerHTML=isEn?'英语中 <span>⇄</span> 拼音':'拼音中 <span>⇄</span> 英语';$('learned').textContent=`已认识 ${seen} 个`;$('progress').style.width=(seen/items.length*100)+'%';$('total').textContent=`共 ${items.length} 个`;
 $('catalog').innerHTML=groups().map(([name,arr])=>`<section class="section"><div class="section-head"><h2>${name}</h2><small>${mode==='zh'?({声母:'气流和嘴巴一起做动作',平舌音:'舌尖平平的 z c s',翘舌音:'舌尖翘起 zh ch sh r',单韵母:'六个基本韵母',复韵母:'两个元音连起来',特殊韵母:'鼻韵母和特别的 er'}[name]||''):name==='大写字母'?'先认大写，再来认小写':''}</small></div><div class="grid ${isEn?'english-grid':''} ${name==='小写字母'?'lower':''}">${arr.map(x=>`<button class="tile ${visited[mode].has(x.char)?'done':''} ${items[idx]?.char===x.char&&$('detail').classList.contains('hidden')?'current':''}" data-char="${x.char}">${x.char}</button>`).join('')}</div></section>`).join('');document.querySelectorAll('.tile').forEach(b=>b.onclick=()=>openItem(b.dataset.char));$('start').textContent=isEn?'开始学习　→':'开始学习　→'}
function itemIndex(ch){return data[mode].findIndex(x=>x.char===ch)}function openItem(ch){idx=Math.max(0,itemIndex(ch));$('detail').classList.remove('hidden');$('fixed').classList.add('hidden');renderDetail(false)}function closeDetail(){clearTimeout(detailTimer);$('card').classList.remove('shift-left','shift-right');stopSpeech();$('detail').classList.add('hidden');$('fixed').classList.remove('hidden');render()}
function renderDetail(animate,direction='left'){let x=data[mode][idx],card=$('card');clearTimeout(detailTimer);if(animate){card.classList.remove('shift-left','shift-right');card.classList.add(direction==='left'?'shift-left':'shift-right');detailTimer=setTimeout(()=>{fill();card.classList.remove('shift-left','shift-right')},130)}else fill();function fill(){$('char').textContent=x.char;$('soundGuide').textContent=mode==='zh'&&initialGuide[x.char]?`跟我读：${initialGuide[x.char]}`:'';$('kind').textContent=x.kind;$('example').textContent=x.example;$('translation').textContent=x.translation;$('translation').classList.toggle('hidden',!x.translation);$('tip').textContent=x.tip;let scene=getScene(x);$('scene').innerHTML=scene.icons.map(e=>`<span>${e}</span>`).join('');card.style.setProperty('--scene-bg',scene.bg);$('detailCount').textContent=`${idx+1} / ${data[mode].length}`;$('prev').disabled=idx===0;$('next').disabled=false;visited[mode].add(x.char)}}
function getScene(x){let s=x.example+' '+x.char+' '+(x.translation||'');if(/挖掘机|工程车/.test(s))return{icons:['🚜','🦺','🏗️'],bg:'#fff7e8'};if(/恐龙/.test(s))return{icons:['🦕','🌋','🦖'],bg:'#eef7e9'};if(/奥特曼|超人|勇敢/.test(s))return{icons:['⭐','🦸','✨'],bg:'#edf4ff'};if(/汪汪队|Paw Patrol/i.test(s))return{icons:['🐾','🚒','⭐'],bg:'#eff6ff'};if(/老师|课堂|上学|幼儿园|朋友|同学|排队|操场|书包|学校/i.test(s))return{icons:['🎒','🖍️','🧸'],bg:'#eff8f3'};if(mode==='en'){let map={D:['🦕','🌿','🦖'],P:['🐾','🚒','⭐'],S:['🏫','🎒','🖍️'],B:['📚','✏️','📖'],F:['🧒','🤝','😊'],G:['🎲','🧸','⭐'],T:['🧸','🚜','🦖']};return{icons:map[x.char.toUpperCase()]||['🎒','⭐','🖍️'],bg:'#eff8f3'}}return{icons:['🧸','⭐','🎒'],bg:'#f5f5ed'}}
function speak(){stopSpeech();const token=speechToken,x=data[mode][idx],player=$('player');let name=mode==='zh'?x.char.replaceAll('ü','v'):x.char.toUpperCase();player.src=`assets/${mode==='zh'?'pinyin':'english'}/${name}.wav`;player.onplay=()=>{if(token===speechToken){isSpeaking=true;$('play').classList.add('active')}};player.onended=()=>{if(token===speechToken){isSpeaking=false;$('play').classList.remove('active')}};player.onerror=()=>{if(token===speechToken){isSpeaking=false;$('play').classList.remove('active');$('tip').textContent='音频加载失败，请重新打开本地页面。'}};player.play().catch(()=>{if(token===speechToken){isSpeaking=false;$('play').classList.remove('active');$('tip').textContent='无法启动音频，请再点一次播放。'}})}
function stopSpeech(){speechToken++;const player=$('player');player.pause();player.removeAttribute('src');player.load();isSpeaking=false;$('play').classList.remove('active')}
$('switch').onclick=()=>{closeDetail();mode=mode==='zh'?'en':'zh';idx=0;render()};$('start').onclick=()=>openItem(data[mode][0].char);$('back').onclick=closeDetail;$('prev').onclick=()=>{if(idx>0){idx--;renderDetail(true,'right');speak()}};$('next').onclick=()=>{idx=(idx+1)%data[mode].length;renderDetail(true,'left');speak()};$('play').onclick=speak;
let sx=0;$('card').addEventListener('touchstart',e=>sx=e.changedTouches[0].screenX,{passive:true});$('card').addEventListener('touchend',e=>{let dx=e.changedTouches[0].screenX-sx;if(Math.abs(dx)>55){if(dx<0)$('next').click();else $('prev').click()}},{passive:true});render();
</script>
</body></html>
